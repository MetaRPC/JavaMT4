plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'examples.Quickstart'
}

group = 'pro.mrpc'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    // src/main/java uses Java 16+ syntax (pattern-matching instanceof, switch arrows).
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

// The MetaRPC gRPC stubs (mt4_term_api.*, mrpc_admin.*) ship pre-generated under package/.
// They were not part of any source set before, so the gRPC transport (the only way to reach
// mt4.mrpc.pro:443) could not be used from this build. Compile them together with src/main/java.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'package']
        }
    }
}

ext {
    slf4jVersion = '2.0.9'
    grpcVersion = '1.75.0'
    protobufVersion = '4.31.1'   // must be >= the gencode version stamped in package/*.java (4.31.1)
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    implementation "org.slf4j:slf4j-log4j12:$slf4jVersion"

    // gRPC transport for package/ (MetaRPC mt4_term_api)
    implementation "io.grpc:grpc-netty-shaded:$grpcVersion"
    implementation "io.grpc:grpc-protobuf:$grpcVersion"
    implementation "io.grpc:grpc-stub:$grpcVersion"
    implementation "com.google.protobuf:protobuf-java:$protobufVersion"
    implementation 'com.google.api.grpc:proto-google-common-protos:2.59.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

test {
    useJUnitPlatform()
}

javadoc {
    // generated stubs are not javadoc-clean
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'MetaTrader 4 SDK',
                'Implementation-Version': version,
        )
    }
}
