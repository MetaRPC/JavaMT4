plugins {
    id 'java-library'
    id 'application'
    id 'maven-publish'
}

application {
    mainClass = 'examples.Quickstart'
}

group = 'pro.mrpc'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
    withJavadocJar()
}

// Class files for Java 17+, whichever JDK builds them.
tasks.withType(JavaCompile).configureEach { options.release = 17 }

// The gRPC stubs generated from the MT4 protos (package mt4_term_api), synced into package/ by the MetaRPC CI. They are
// protobuf 3.x code (generated by protoc 3.x): protobuf-java comes with grpc-protobuf (3.25.x), not 4.x.
sourceSets {
    main {
        java {
            srcDirs += ['package']
        }
    }
}

ext {
    slf4jVersion = '2.0.9'
    grpcVersion = '1.70.0'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "io.grpc:grpc-inprocess:$grpcVersion"

    api "io.grpc:grpc-netty-shaded:$grpcVersion"
    api "io.grpc:grpc-protobuf:$grpcVersion"
    api "io.grpc:grpc-stub:$grpcVersion"
    api 'com.google.api.grpc:proto-google-common-protos:2.50.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    implementation "org.slf4j:slf4j-log4j12:$slf4jVersion"
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'mt4'
            from components.java
        }
    }
}

// The generated stubs carry no Javadoc comments on every member; do not fail the build on them.
javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'MetaTrader 4 SDK',
                'Implementation-Version': version,
        )
    }
}
