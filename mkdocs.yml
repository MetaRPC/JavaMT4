site_name: JavaMT4 SDK Documentation
site_url: https://metarpc.github.io/JavaMT4/
site_description: Complete Java SDK for MetaTrader 4 trading automation via gRPC

repo_name: MetaRPC/JavaMT4
repo_url: https://github.com/MetaRPC/JavaMT4
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/language-java
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  custom_dir: docs/includes

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MetaRPC/JavaMT4
      name: JavaMT4 on GitHub

extra_css:
  - styles/custom.css

extra_javascript:
  - javascripts/ux.js

markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: "¶"
      toc_depth: 3

plugins:
  - search

copyright: >
  Copyright © 2024–2025 MetaRPC. MT4 is a trademark of MetaQuotes Software Corp.
  This documentation is community-maintained and not affiliated with MetaQuotes.

nav:
  - Home: index.md

  - Guides:
    - Getting Started: All_Guides/GETTING_STARTED.md
    - Your First Project: All_Guides/Your_First_Project.md
    - Connection: connection.md
    - Account: account.md
    - Trading: trading.md
    - Quotes: quotes.md
    - Streams: All_Guides/STREAMS.md
    - Errors: All_Guides/ERRORS.md

  - API Reference:
    - MT4Account: api.md
    - API methods: API_Reference/methods.md
    - Messages: API_Reference/messages.md
    - Enums: API_Reference/enums.md
