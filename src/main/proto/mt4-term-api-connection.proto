syntax = "proto3";
option csharp_namespace = "mt4_term_api";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "mrpc-mt4-error.proto";

package mt4_term_api;
option go_package = "git.mtapi.io/root/mrpc-proto.git/mt4/libraries/go";

service Connection {
  // Creates terminal connection to the MT5 server by MT cluster name, waits for connection and returns Guid of it 
  // [DefaultValues]
  // {
  //   "user": "1124213727",
  //   "password": "1tjvjck",
  //   "mtClusterName": "FreshForex-Demo"
  // }  
  rpc ConnectEx (ConnectExRequest) returns (ConnectExReply) {
    option (google.api.http) = {
      get: "/ConnectEx"
    };
  }
  // Creates terminal connection to the MT4 server and returns Guid of it
  // [DefaultValues]
  // {
  //   "user": "501401178",
  //   "password": "v8gctta",
  //   "host": "mt4-demo.roboforex.com",
  //   "port": "443",
  //   "baseChartSymbol": "EURUSD",  
  //   "waitForTerminalIsAlive": "true"
  // }
  rpc Connect (ConnectRequest) returns (ConnectReply){
    option (google.api.http) = {
      get: "/Connect"
    };
    // Returns terminal connection unique identifier
  };
  // Connect to account with user, password, host, port.
  // [DefaultValues] 
  // { 
  //  "user": "500476959", 
  //  "password": "ehj4bod", 
  //  "host": "mt4-demo.roboforex.com", 
  //  "port": "443",
  //  "proxyUser": "ProxyUser123", 
  //  "proxyPassword": "qwerty123", 
  //  "proxyHost": "65.108.126.217", 
  //  "proxyPort": "1080", 
  //  "proxyType": "Socks5" 
  // }
  rpc ConnectProxy (ConnectProxyRequest) returns (ConnectProxyReply){
    option (google.api.http) = {
      get: "/ConnectProxy"
    };    
  }  
  // Checks if terminal connection to MT4 server is alive
  rpc CheckConnect (CheckConnectRequest) returns (CheckConnectReply){
    option (google.api.http) = {
      get: "/CheckConnect"
    };
    // Do not forget to add header 'mt-sticky-session-header' with terminal connection unique identifier
  };
  // Returns detailed live connection state of this terminal instance
  rpc ConnectState (ConnectStateRequest) returns (ConnectStateReply) {
    option (google.api.http) = {
      get: "/ConnectState"
    };
  };
  // Streams real-time connection state changes for specified or visible terminals
  rpc OnConnectState (OnConnectStateRequest) returns (stream OnConnectStateReply) {
    option (google.api.http) = {
      get: "/OnConnectState"
    };
  };
  // Deprecated alias for ConnectState
  rpc ConnectionStatus (ConnectionStatusRequest) returns (ConnectionStatusReply) {
    option (google.api.http) = {
      get: "/ConnectionStatus"
    };
  };
  // Close terminal connection to MT4 server
  rpc Disconnect (DisconnectRequest) returns (DisconnectReply){
    option (google.api.http) = {
      get: "/Disconnect"
    };
    // Do not forget to add header 'mt-sticky-session-header' with terminal connection unique identifier
  };
  // If you need to recreate terminal instance with the same id
  rpc Reconnect (ReconnectRequest) returns (ReconnectReply) {
    option (google.api.http) = {
      get: "/Reconnect"
    };
  }
  // Rebuild a terminal instance from a previously-saved token_details_mt4 row. The id header
  // names the terminal to bring back; every credential (User/Password/Server or Host+Port,
  // proxy settings, servers.dat bytes, PfxFile, HardwareId, Build) is read from the DB. Same
  // reply as ConnectEx so callers do not need a separate result path.
  rpc ConnectByToken (ConnectByTokenRequest) returns (ConnectExReply) {
    option (google.api.http) = {
      get: "/ConnectByToken"
    };
  }
  
  rpc GetBrokerServersByBrokerName (GetBrokerServersByBrokerNameRequest) returns (GetBrokerServersByBrokerNameReply) {
    option (google.api.http) = {
      get: "/GetBrokerServersByBrokerName"
    };
  }
  // Generates a deterministic GUID from user and password.
  // The same user/password combination always produces the same GUID.
  // Use this GUID as the 'id' header for Connect and other endpoints.
  // [DefaultValues]
  // {
  //   "user": "1124213727",
  //   "password": "1tjvjck"
  // }
  rpc GetId (GetIdRequest) returns (GetIdReply) {
    option (google.api.http) = {
      get: "/GetId"
    };
  }
  // Captures a screenshot of the terminal instance window.
  // Handled by Terminal Manager: the per-terminal in-process responder grabs the
  // MT4 window and the manager returns the image. Requires 'id' header.
  rpc Screenshot (ScreenshotRequest) returns (ScreenshotReply) {
    option (google.api.http) = {
      get: "/Screenshot"
    };
  }
  // Same as Connect but streams real-time progress events (incl. live Journal/
  // Experts log lines) while the connection is established.
  // Optional 'id' header — automatically generated by the server if omitted.
  // Swagger does not support streaming — use /connect-stream interactive viewer.
  rpc ConnectStream (ConnectRequest) returns (stream ConnectStreamEvent) {
    option (google.api.http) = {
      get: "/ConnectStream"
    };
  }
  // Same as ConnectEx but streams real-time progress events (incl. live Journal/
  // Experts log lines) while the connection is established.
  // Optional 'id' header — automatically generated by the server if omitted.
  // Swagger does not support streaming — use /connect-stream interactive viewer.
  // [DefaultValues]
  // {
  //   "user": "1124213727",
  //   "password": "1tjvjck",
  //   "mtClusterName": "FreshForex-Demo"
  // }
  rpc ConnectExStream (ConnectExRequest) returns (stream ConnectStreamEvent) {
    option (google.api.http) = {
      get: "/ConnectExStream"
    };
  }
}

// Event message streamed during ConnectStream / ConnectExStream.
message ConnectStreamEvent {
  // Step name: "Init", "Validation", "ColdStart-CreateInstance",
  // "ColdStart-ReadinessCheck", "Journal", "Experts", "Complete", "Error", ...
  string step = 1;
  // Human-readable message with details (for Journal/Experts steps: the log line)
  string message = 2;
  // Log level: INFO, WARN, ERROR
  string level = 3;
  // Elapsed milliseconds since start
  int64 elapsed_ms = 4;
  // Timestamp of this event
  google.protobuf.Timestamp timestamp = 5;
  // True only on the final event (success or error)
  bool is_final = 6;
  // Populated only on the final success event
  ConnectData connect_data = 7;
  // Populated only on the final error event
  Error error_data = 8;
}

// Provides access to terminal log content (Journal and Experts tabs).
// Reads log entries directly from the MT4 terminal GUI.
// Requires 'id' header with the terminal connection GUID returned by Connect.
service Logs {
  // Returns log entries from the terminal Journal tab.
  // The Journal tab contains system messages about terminal connection status,
  // network activity, server synchronization and other internal events.
  // Works regardless of which tab is currently active in the terminal UI.
  rpc Journal (JournalRequest) returns (JournalReply) {
    option (google.api.http) = {
      get: "/Logs/Journal"
    };
  }
  // Streams log entries from the terminal Journal tab in real-time.
  // Requires 'id' header with the terminal connection GUID returned by Connect.
  rpc OnJournal (OnJournalRequest) returns (stream OnJournalReply) {
    option (google.api.http) = {
      get: "/Logs/OnJournal"
    };
  }
  // Returns log entries from the terminal Experts tab.
  // The Experts tab contains messages from Expert Advisors (EAs), scripts and indicators
  // including Print() output, initialization/deinitialization events and runtime errors.
  // Works regardless of which tab is currently active in the terminal UI.
  rpc Experts (JournalRequest) returns (JournalReply) {
    option (google.api.http) = {
      get: "/Logs/Experts"
    };
  }
  // Streams log entries from the terminal Experts tab in real-time.
  // Requires 'id' header with the terminal connection GUID returned by Connect.
  rpc OnExperts (OnJournalRequest) returns (stream OnJournalReply) {
    option (google.api.http) = {
      get: "/Logs/OnExperts"
    };
  }
}

message JournalRequest {
}
message JournalReply {
  oneof response {
    GetTerminalJournalData data = 1;
    Error error = 2;
  }
}
message OnJournalRequest {
}
message OnJournalReply {
  oneof response {
    GetTerminalJournalData data = 1;
    Error error = 2;
  }
}
message GetTerminalJournalData {
  // List of log rows from the terminal tab
  repeated TerminalJournalRow rows = 1;
}
message TerminalJournalRow {
  // Timestamp of the log entry
  google.protobuf.Timestamp time = 1;
  // Source of the log entry (e.g. "Network", "MQL4", "Tester", EA name)
  string source = 2;
  // Log message text
  string message = 3;
}

message ScreenshotRequest {
}
message ScreenshotReply {
  oneof response {
    ScreenshotData data = 1;
    Error error = 2;
  }
}
message ScreenshotData {
  bytes image_data = 1;
  int32 display_number = 2;
  string terminal_id = 3;
  string content_type = 4;
}

message GetBrokerServersByBrokerNameRequest {
  string BrokerName = 1;
}
message GetBrokerServersByBrokerNameReply {
  oneof response {
    GetBrokerServersByBrokerNameData data = 1;
    Error error = 2;
  }
}
message GetBrokerServersByBrokerNameData {
  repeated BrokerResult result = 1;

  message BrokerResult {
    string company = 1;
    repeated BrokerServer results = 2;
  }

  message BrokerServer {
    string name = 1;
    optional string logo_url = 2;
    optional string site = 3;
    repeated string access = 4;
  }
}

message ConnectExRequest {
  uint64 user = 1; // Account number. [Required]
  string password = 2; // Password. [Required]
  string mt_cluster_name = 3; // MT cluster name. [Required]
  reserved 4;
  reserved "base_chart_symbol";
  repeated ExpertAdviser experts_to_add = 5; // EA files to add to terminal instance [Optional]
  optional uint32 timeout_seconds = 6; // Time waiting for terminal being connected (default 60) [Optional]
  optional string name = 7; // Optional terminal name or creator identifier [Optional]
  optional uint32 expiration = 8; // Optional terminal lifetime in minutes. 0 (default) = infinite (trial max 15 min). [Optional]
}

// Rebuild a terminal from token_details_mt4. All the credentials (User/Password/Server or
// Host+Port, proxy, servers.dat, PFX, HardwareId, Build) come from the DB row; the request
// carries only optional wait overrides. The terminal id MUST be supplied in the
// grpc 'id' header (same as every other Connect*/query call).
message ConnectByTokenRequest {
  reserved 1;
  reserved "base_chart_symbol";
  optional uint32 timeout_seconds = 2;     // override how long to wait for the terminal (default 60) [Optional]
  optional uint32 expiration = 3;          // Optional terminal lifetime in minutes. 0 (default) = infinite (trial max 15 min). [Optional]
}
message ConnectExReply {
  oneof response {
    ConnectData data = 1;
    Error error = 2;
  }
}

message ReconnectRequest {
  optional bool force_reconnection = 1;   // Recreate a terminal instance even if current instance is alive
}
message ReconnectReply {
  oneof response {
      ReconnectData data = 1;
      Error error = 2;
  }
}
message ReconnectData {
  bool terminal_was_recreated = 1;
  TerminalType terminal_type = 2;
  string terminal_instance_guid = 3;
  int64 old_terminal_full_live_time_seconds = 4;
  repeated LogFileInfo old_log_files = 5;
}

message ConnectRequest {
  uint64 user = 1; // Account number. [Required]
  string password = 2; // Password. [Required]
  string host = 3;   // Host - ip address or dns name. [Required]
  int32 port = 4;   // Port. [Required]
  repeated ExpertAdviser experts_to_add = 5;
  optional uint32 timeout_seconds = 6; // Time waiting for terminal being connected (default 60) [Optional]
  optional string name = 7; // Optional terminal name or creator identifier [Optional]
  optional uint32 expiration = 8; // Optional terminal lifetime in minutes. 0 (default) = infinite (trial max 15 min). [Optional]
}

message ExpertAdviser
{
  string file_name = 1;
  bytes file_content = 2;  // File content as a byte array
}

message ConnectReply {
  oneof response {
    ConnectData data = 1;
    Error error = 2;
  }
}
message ConnectData {
  // Connection unique identifier - use this in the 'mt-sticky-session-header' value
  string terminal_instance_guid = 1;
  // Terminal type MT5 or MT4 (Temporary only MT5)
  TerminalType terminal_type = 3;
}

// Specifies the type of proxy servers that an instance of the ProxySocket class can use.
enum ProxyTypes {
  // No proxy server; the ProxySocket object behaves exactly like an ordinary Socket object.
  None = 0;
  // A HTTPS (CONNECT) proxy server.
  Https = 1;
  // A SOCKS4[A] proxy server.
  Socks4 = 2;
  // A SOCKS5 proxy server.
  Socks5 = 3;
}

// [DefaultValues]
// {
//  "user": "21455",
//  "password": "1nJeS+Ae",
//  "host": "95.217.147.61",
//  "port": "443",
//  "proxyUser": "ProxyUser123",
//  "proxyPassword": "qwerty123",
//  "proxyHost": "65.108.126.217",
//  "proxyPort": "1080",
//  "proxyType": "Socks5"
// }
message ConnectProxyRequest {
  // Account number. [Required]
  uint64 user = 1;
  // Password. [Required]
  string password = 2;
  // Host - ip address or dns name. [Required]
  string host = 3;
  // Port. [Required]
  int32 port = 4;
  // Proxy user [Required]
  string proxyUser = 5;
  // Proxy password [Required]
  string proxyPassword = 6;
  // Proxy server ip address [Required]
  string proxyHost = 7;
  // Proxy port [Required]
  uint32 proxyPort = 8;
  // Proxy type. Put 'Socks5' for default parameters [Required]
  ProxyTypes proxyType = 9;
  repeated ExpertAdviser experts_to_add = 10;
  optional uint32 timeout_seconds = 11; // Time waiting for terminal being connected (default 60) [Optional]
  optional string name = 12; // Optional terminal name or creator identifier [Optional]
  optional uint32 expiration = 13; // Optional terminal lifetime in minutes. 0 (default) = infinite (trial max 15 min). [Optional]
}

message ConnectProxyReply {
  oneof response {
      ConnectProxyData data = 1;
      Error error = 2;
  }
}
message ConnectProxyData {
  // Connection unique identifier - use this in the header 'mrpc-terminal-guid' value
  string unique_identifier = 1;
  // Terminal type MT5 or MT4 (Temporary only MT5)
  TerminalType terminal_type = 2;
}

enum TerminalType {
  MT4 = 0;
  MT5 = 1;
}

// Do not forget to add header 'mt-sticky-session-header' with a Connection unique identifier value
message CheckConnectRequest {
}

message CheckConnectReply {
    oneof response {
      CheckConnectData data = 1;
      Error error = 2;
    }
}
message CheckConnectData {
  // Connection unique identifier. Reflects value from header 'mt-sticky-session-header'
  string unique_identifier = 1;
  // Connection health status
  TerminalHealthCheck health_check = 2;
}

message TerminalHealthCheck
{
  // Connection is alive
  bool is_alive = 1;
  bool api_is_alive = 2;
  bool terminal_is_connected_to_mt_server = 3;
}

// Do not forget to add header 'mt-sticky-session-header' with a Connection unique identifier value
message DisconnectRequest {
  optional string reason = 1;
  optional bool delete = 2;
}

message DisconnectReply {
  oneof response {
      DisconnectData data = 1;
      Error error = 2;
  }
}

message DisconnectData {
  // Identifier of closed connection. Reflects value from header 'mt-sticky-session-header'
  string unique_identifier = 1;
  int64 full_life_time_seconds = 2;
}

message GetIdRequest {
  // Account number [Required]
  string user = 1;
  // Account password [Required]
  string password = 2;
}
message GetIdReply {
  oneof response {
    GetIdData data = 1;
    Error error = 2;
  }
}
message GetIdData {
  // Deterministic GUID generated from user+password
  string id = 1;
}

message ConnectStateRequest {
}

message ConnectStateReply {
  oneof response {
    ConnectStateData data = 1;
    Error error = 2;
  }
}

message OnConnectStateRequest {
  repeated string terminal_ids = 1;
}

message OnConnectStateReply {
  oneof response {
    ConnectStateData data = 1;
    Error error = 2;
  }
}

message ConnectStateData {
  string id = 1;
  string state = 2; // "Queued", "Starting", "Authorizing", "Syncing", "Connected", "WrongPassword", "Unreachable", "Stopped", "Expired"
  bool is_connected = 3;
  bool is_alive = 4;
  bool api_is_alive = 5;
  string server = 6;
  uint64 account = 7;
  string error_message = 8;
  google.protobuf.Timestamp timestamp = 9;
}

message ConnectionStatusRequest {
}

message ConnectionStatusReply {
  oneof response {
    ConnectionStatusData data = 1;
    Error error = 2;
  }
}

message ConnectionStatusData {
  string id = 1;
  bool is_connected = 2;
  bool is_alive = 3;
  bool api_is_alive = 4;
  string server = 5;
  uint64 account = 6;
  string error_message = 7;
  string state = 8;
}